<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 320px;
    }

    h1 {
      color: #e63946;
      font-size: 26px;
      margin-bottom: 20px;
    }

    .buttons {
      position: relative;
      height: 120px;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      position: absolute;
      transition: 0.3s;
    }

    #yes {
      background: #38b000;
      color: white;
      left: 30px;
      bottom: 20px;
    }

    #no {
      background: #d00000;
      color: white;
      right: 30px;
      bottom: 20px;
    }

    .love {
      font-size: 40px;
      margin-top: 10px;
      animation: pop 1s infinite alternate;
    }

    @keyframes pop {
      from { transform: scale(1); }
      to { transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Will you be my Valentine? 💖</h1>

    <div class="buttons">
      <button id="yes" onclick="yesClicked()">Yes 💘</button>
      <button id="no" onmouseover="moveNo()">No 😜</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    function moveNo() {
      const noBtn = document.getElementById("no");
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function yesClicked() {
      document.querySelector(".card").innerHTML = `
        <h1>Yaaay! 💕</h1>
        <p>You just made my day ❤️</p>
        <div class="love">💖💖💖</div>
      `;
    }
  </script>

</body>
</html>
