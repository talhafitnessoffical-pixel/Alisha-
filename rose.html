<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Rose Day</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    font-family: 'Arial', sans-serif;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    width:320px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.card img{
    width:100%;
    border-radius:15px;
}

h2{
    color:#ff4d6d;
    margin-top:15px;
}

p{
    font-size:16px;
    color:#444;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="card">
    <img src="https://i.imgur.com/rqUnX2w.jpeg" alt="Rose">
    
    <h2>Happy Rose Day 🌹</h2>

    <p>
    Ye gulaab sirf phool nahi,<br>
    Mere dil ka ek ehsaas hai 💖<br><br>

    Tum muskura do ek baar bas,<br>
    Meri har subah khaas hai ✨<br><br>

    Rose Day ho ya Valentine,<br>
    Tum ho to har din special hai 🥰
    </p>
</div>

</body>
</html>
